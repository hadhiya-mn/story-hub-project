{% include 'user_header.html' %}

<div class="container py-5">

<h2 class="mb-4">
Saved Blogs
</h2>

<div class="row">

{% for s in saved %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm border-0">

<img src="{{ s.BLOG.image.url }}"
     class="card-img-top"
     style="height:220px;object-fit:cover;">

<div class="card-body">

<h5>
{{ s.BLOG.title }}
</h5>

<p>
{{ s.BLOG.content|truncatewords:20 }}
</p>

<a href="{% url 'blog_detail' s.BLOG.id %}"
   class="btn btn-primary">

Read More

</a>

</div>

</div>

</div>

{% empty %}

<p>
No saved blogs
</p>

{% endfor %}

</div>

</div>

{% include 'footer.html' %}
