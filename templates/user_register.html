{% include 'public_header.html' %}

<style>
.register-section{
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
    background: #f8f9fc;
}

.register-card{
    width: 100%;
    max-width: 500px;
    background: #fff;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.register-card h2{
    text-align: center;
    margin-bottom: 30px;
    color: #102745;
    font-weight: 700;
}

.form-group{
    margin-bottom: 18px;
}

.form-group label{
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #444;
}

.form-control{
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.3s;
}

.form-control:focus{
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 8px rgba(59,130,246,0.2);
}

.register-btn{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #0a2551;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.register-btn:hover{
    background: #0b2150;
    transform: translateY(-2px);
}

.login-link{
    text-align: center;
    margin-top: 20px;
}

.login-link a{
    text-decoration: none;
    color: #3b82f6;
    font-weight: 600;
}
</style>

<div class="register-section">

    <div class="register-card">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Place</label>
                <input type="text" name="place" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

            <div class="login-link">
                Already have an account?
                <a href="/login">Login</a>
            </div>

        </form>

    </div>

</div>

{% include 'footer.html' %}
