{% include 'user_header.html' %}

<style>
.edit-section{
    min-height:80vh;
    background:#f8f9fa;
    padding:60px 20px;
}

.edit-card{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.edit-card h2{
    text-align:center;
    margin-bottom:30px;
    color:#23436b;
    font-weight:700;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea.form-control{
    min-height:180px;
    resize:vertical;
}

.current-image{
    width:100%;
    max-width:250px;
    border-radius:10px;
    margin-top:10px;
    margin-bottom:15px;
}

.btn-update{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-weight:600;
}

.btn-update:hover{
    opacity:0.9;
}

.back-link{
    margin-left:10px;
    text-decoration:none;
}
</style>

<div class="edit-section">

    <div class="edit-card">

        <h2>Edit Blog</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Title</label>
                <input type="text"
                       name="title"
                       value="{{ blog.title }}"
                       class="form-control"
                       required>
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea name="content"
                          class="form-control"
                          required>{{ blog.content }}</textarea>
            </div>

            <div class="form-group">

                <label>Current Image</label>

                {% if blog.image %}
                    <br>
                    <img src="{{ blog.image.url }}"
                         class="current-image"
                         alt="Blog Image">
                {% endif %}

            </div>

            <div class="form-group">
                <label>Change Image (Optional)</label>
                <input type="file"
                       name="image"
                       class="form-control">
            </div>

            <button type="submit" class="btn-update">
                Update Blog
            </button>

            <a href="{% url 'myblog' %}" class="back-link">
                Back to My Blogs
            </a>

        </form>

    </div>

</div>

{% include 'footer.html' %}
