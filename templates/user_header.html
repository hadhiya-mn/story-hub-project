{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

    body{
        margin:0;
        padding:0;
        font-family:Arial,sans-serif;
        background:#f5f7fa;
    }

    .navbar{
        background:#1e3557;
        padding:15px 0;
        box-shadow:0 2px 10px rgba(0,0,0,.1);
    }

    .navbar-brand{
        color:white !important;
        font-size:24px;
        font-weight:700;
    }

    .navbar-nav .nav-link{
        color:white !important;
        margin-left:15px;
        font-weight:500;
        transition:.3s;
    }

    .navbar-nav .nav-link:hover{
        color:#ffd166 !important;
    }

    .profile-nav{
        width:40px;
        height:40px;
        border-radius:50%;
        object-fit:cover;
        border:2px solid white;
    }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'user_home' %}">

            StoryHub

        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'user_home' %}">

                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'myblog' %}">

                        My Blogs

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'explore' %}">

                        Explore

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'saved_blogs' %}">

                        Saved

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'user_profile' %}">

                        Profile

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       href="{% url 'logout' %}">

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
