{% include 'public_header.html' %}

<style>

body{
    background:#f4f7fc;
}

.login-container{
    min-height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.login-card h2{
    text-align:center;
    margin-bottom:10px;
    font-weight:700;
    color:#1e3557;
}

.login-subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

.form-control{
    width:100%;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    transition:0.3s;
}

.form-control:focus{
    outline:none;
    border-color:#4f46e5;
    box-shadow:0 0 8px rgba(79,70,229,0.2);
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#3730a3;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    text-decoration:none;
    color:#4f46e5;
    font-weight:600;
}

.alert-danger{
    background:#ffe5e5;
    color:#c62828;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    font-weight:600;
}

</style>

<div class="login-container">

    <div class="login-card">

        <h2>
            Welcome Back
        </h2>

        <p class="login-subtitle">
            Sign in to continue reading and sharing blogs
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="alert-danger">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       required>

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <div class="register-link">

            <p>

                Don't have an account?

                <a href="/user_register">

                    Register Here

                </a>

            </p>

        </div>

    </div>

</div>

{% include 'footer.html' %}
